<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impressum — SELFWEAR</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0a0a0a;
    --muted:#6b6b6b;
    --line:#e7e5e2;
    --bg:#ffffff;
    --accent:#e63027;
    --max:1200px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.55;overflow-x:clip}
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit;text-decoration:none}

  .shell{max-width:var(--max);margin:0 auto;padding:0 40px}

  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,0.92);
    backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
  .mark{display:flex;align-items:center;gap:14px}
  .mark .logo-svg{height:24px;width:auto;display:block}
  .footer-mark{height:18px;width:auto;display:block;vertical-align:middle}
  .nav-cta{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:11px;
    letter-spacing:0.22em;text-transform:uppercase;
    border:1px solid var(--ink);padding:9px 16px;border-radius:999px;
    transition:all .2s ease;white-space:nowrap;
  }
  .nav-cta:hover{background:var(--ink);color:#fff}

  .display{
    font-family:'Archivo Black','Archivo',sans-serif;
    font-weight:900;letter-spacing:-0.02em;line-height:0.92;
    text-transform:uppercase;color:var(--ink);
  }
  .eyebrow{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);
  }
  .label{
    font-family:'Archivo',sans-serif;font-weight:600;font-size:11px;
    letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);
    margin-bottom:10px;
  }

  .legal{padding:96px 0 64px}
  .legal h1{font-size:clamp(48px,7vw,96px);margin:24px 0 64px}
  .legal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:48px 40px;border-top:1px solid var(--line);padding-top:40px}
  .legal-grid p{font-size:16px;line-height:1.7;color:#2a2a2a}
  .legal-grid a:hover{color:var(--accent)}

  footer{padding:48px 0 56px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
  footer .row{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
  footer .sig{font-family:'Archivo',sans-serif;letter-spacing:0.04em}
  footer .sig em{font-style:normal;color:var(--ink)}
  footer .legal-link{font-family:'Archivo',sans-serif;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;font-size:11px}
  footer .legal-link:hover{color:var(--accent)}

  @media (max-width:768px){
    .shell{padding:0 20px}
    .nav-inner{height:60px}
    .mark .logo-svg{height:20px}
    .legal{padding:56px 0 40px}
    .legal h1{margin:16px 0 40px}
    .legal-grid{gap:32px}
    footer{padding:36px 0 48px}
    footer .row{flex-direction:column;align-items:flex-start;gap:16px}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="shell nav-inner">
    <a class="mark" href="index.html" aria-label="Selfwear">
      <svg viewBox="0 0 316 40" xmlns="http://www.w3.org/2000/svg" class="logo-svg" role="img" aria-label="Selfwear">
        <text x="0" y="31" font-family="'Archivo Black','Archivo',sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#E60005">SELFWEAR</text>
      </svg>
    </a>
    <a class="nav-cta" href="index.html">&#8592; Back</a>
  </div>
</header>

<main class="legal">
  <div class="shell">
    <div class="eyebrow">Angaben gemäß § 5 DDG</div>
    <h1 class="display">Impressum</h1>

    <div class="legal-grid">
      <div>
        <div class="label">Anbieter</div>
        <p>eekual bionic GmbH<br>Marienstraße 25<br>50825 Köln<br>Deutschland</p>
      </div>
      <div>
        <div class="label">Geschäftsführer</div>
        <p>Maximilian Bock<br>William Lyons</p>
      </div>
      <div>
        <div class="label">Registereintrag</div>
        <p>Amtsgericht Köln<br>HRB 93418</p>
      </div>
      <div>
        <div class="label">Kontakt</div>
        <p><a href="mailto:hello@selfwear.co">hello@selfwear.co</a></p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="shell row">
    <div class="sig" style="display:flex;align-items:center;gap:12px">
      <svg viewBox="0 0 316 40" xmlns="http://www.w3.org/2000/svg" class="footer-mark" role="img" aria-label="Selfwear">
        <text x="0" y="31" font-family="'Archivo Black','Archivo',sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#E60005">SELFWEAR</text>
      </svg>
      <span><em>SELFWEAR<sup>®</sup></em> &mdash; Clothes That Love You.</span>
    </div>
    <a class="legal-link" href="impressum.html">Impressum</a>
  </div>
</footer>

</body>
</html>
